apis:
- aid: agora-data-loan-import-api
  name: Agora Data Loan Import API
  description: 'The public Agora Data loan-data API used by dealer management system
    (DMS) vendors and integration partners to move Buy Here Pay Here loan portfolio
    data into the Agora platform. It exposes multipart file-import operations per DMS
    vendor and upload subtype (including a priority-upload lane), an import-format
    descriptor, upload/activity status lookups, loan listing and deletion, a provider
    passthrough surface, OAuth authorize/token and username-password login endpoints,
    inbound file-delivery webhook receivers for iDMS and Auto Master, a HomeNet inventory
    aggregation job trigger, and a health endpoint. Served as a FastAPI application
    publishing OpenAPI 3.1.0 at the API host root.'
  humanURL: https://api.agoradata.com/docs
