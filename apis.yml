description: 'Agora Data, Inc. is an Arlington, Texas fintech that provides capital,
  analytics and loan-servicing technology to the non-prime and Buy Here Pay Here (BHPH)
  automotive finance market. Its platform lets independent auto dealers and other loan
  originators publish, analyze and sell their retail installment contract portfolios:
  AgoraCapital provides structured financing that connects originators to capital-markets
  funding, AgoraInsights delivers portfolio performance analytics, AgoraPortal is the
  originator-facing management console, and Nuron is the proprietary AI risk, pricing
  and fraud modeling system trained on a large non-prime auto finance dataset. Agora
  runs a public loan-data import API at api.agoradata.com that dealer management system
  (DMS) vendors and integration partners use to upload, status-check and delete loan
  portfolio files, plus webhook receivers for iDMS and Auto Master file delivery.'
