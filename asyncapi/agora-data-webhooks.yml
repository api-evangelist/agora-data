  operation_id: idms_file_endpoint_hooks_files_idms_post
  partner: iDMS
  description: >-
    Receiver for iDMS file-delivery notifications. The partner POSTs a FilesWebHookFormat
    payload announcing that a loan data file is available at a path.
  payload_schema: '#/components/schemas/FilesWebHookFormat'
  authentication:
    header: x-agora-files-key
    required_in_spec: false
    note: >-
      Declared as an OPTIONAL header parameter. A shared-secret webhook verifier declared
