notes: >-
  Agora Data publishes no AsyncAPI document. Its event surface is two INBOUND webhook
  receivers declared in the public OpenAPI: endpoints that partner dealer management systems
  (iDMS and Auto Master) POST to when a loan data file is ready for Agora to collect. The
  direction matters — Agora is the webhook CONSUMER here, not the publisher, so there is no
  outbound event catalog for Agora's own customers to subscribe to. Nothing below is
  invented; both receivers and their payload schema are declared in the spec.
direction: inbound
