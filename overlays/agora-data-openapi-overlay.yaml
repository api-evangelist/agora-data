- target: $.components
  update:
    securitySchemes:
      apiKeyAuth:
        type: apiKey
        in: header
        name: X-UNPUBLISHED-API-KEY-HEADER
        description: >-
          RECONSTRUCTED, NOT AUTHORITATIVE. The /api/v1/* operations require an API key —
          unauthenticated calls return HTTP 400 {"detail":"Api Key is required"} — but Agora
          Data does not publish the header name anywhere public. The placeholder name above
          is deliberately non-functional so it cannot be mistaken for a real value. Obtain the
          real header from Agora Data integration support.
      bearerAuth:
        type: http
        scheme: bearer
        description: >-
          RECONSTRUCTED from live probe. /providers requires an Authorization header; tokens
          come from POST /oauth/token.
      oauth2Auth:
        type: oauth2
        description: RECONSTRUCTED from the /oauth/authorize and /oauth/token operations.
        flows:
          authorizationCode:
            authorizationUrl: https://api.agoradata.com/oauth/authorize
            tokenUrl: https://api.agoradata.com/oauth/token
            scopes: {}
      webhookKeyAuth:
        type: apiKey
        in: header
        name: x-agora-files-key
        description: >-
          Shared secret on the inbound DMS webhook receivers. Declared OPTIONAL upstream;
          treated as required here.
